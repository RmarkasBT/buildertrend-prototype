openapi: 3.0.3
info:
  title: Buildertrend Mock — Schedule, Estimate & Daily Logs API
  version: 2.0.0
  description: |
    Local-only, unauthenticated REST API backing the Schedule, Estimate and
    Daily Logs features of a Buildertrend front-end mock (see the repo's
    CAPTURE_LOG.md for what in this app is captured from the real product
    vs. invented for demo purposes). No `security` scheme is defined
    anywhere in this document — that's intentional, not an omission; this
    server only ever runs on localhost for local development/agent use.

    ERRORS: every 4xx/5xx response body is an ErrorResponse whose `error`
    string is written to be actionable — an agent framework hands that text
    back to the model, so it names the offending field and, for jobId, the
    valid values. A malformed JSON body is a 400. Any 500 means a genuine
    server bug, not a caller mistake; individual operations therefore do not
    enumerate '500'.

    UPDATES are partial: PUT (and PATCH, an undocumented alias with identical
    behaviour) change only the fields you send and leave everything else at
    its stored value. This changed in 2.0.0 — it used to be a full replace,
    which silently reset omitted fields.

    This spec is written to be consumed by an agent framework's
    OpenAPI-to-tool machinery (e.g. Google ADK's `OpenAPIToolset`), which
    turns every operation below into a callable function: `operationId`
    becomes the function name, `summary`/`description` become what the
    calling LLM reads to decide when/how to use it, and `parameters`/
    `requestBody` become its typed arguments. Every operation's
    description therefore documents not just *what* it does but its real
    side effects and known gaps — so an agent doesn't have to discover
    them by trial and error.
servers:
  - url: http://localhost:4000
    description: Local dev server (npm run dev / npm run dev:server)

tags:
  - name: Schedule
    description: Per-job schedule items (tasks/milestones) — server/routes.js.
  - name: Estimate
    description: Per-job estimate worksheet (groups + line items) — server/estimateRoutes.js.
  - name: Daily Logs
    description: |
      Per-job daily logs — server/dailyLogRoutes.js. A daily log is one dated
      site report: notes, tags, photos, an audience, and a snapshot of the
      day's weather. Weather is also exposed to non-HTTP agents as MCP tools
      (server/mcp.js).

paths:
  /api/schedule:
    get:
      operationId: listScheduleItems
      tags: [Schedule]
      summary: List all schedule items for a job.
      description: |
        Returns every schedule item belonging to the given job, ordered by
        start date then id. Returns an empty array (not an error) if the
        job has no items yet.
      parameters:
        - $ref: '#/components/parameters/JobIdQuery'
      responses:
        '200':
          description: Array of schedule items for the job (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleItem'
        '400':
          $ref: '#/components/responses/MissingJobId'
    post:
      operationId: createScheduleItem
      tags: [Schedule]
      summary: Create a new schedule item (task or milestone) for a job.
      description: |
        Creates a schedule item under the given job and returns it with
        server-assigned `id`, `createdBy`, `createdAt`, and `updatedAt`.

        Required fields: `jobId`, `title`, `start`. All other fields are
        optional and fall back to sensible defaults (see
        ScheduleItemInput's per-field descriptions) — this mirrors the
        real "New Schedule Item" form, where only Title/Start Date/End
        Date are marked required.

        `end` is derived when omitted: `workDays` counts WORKING days
        (Mon–Fri), so `{start: "2026-08-06", workDays: 3}` ends
        2026-08-10, skipping the weekend. Send `end` instead and
        `workDays` is recounted over that span.

        `createdBy` is always server-set to a fixed demo user regardless
        of what you send — there is no real user/auth concept in this
        mock, so don't bother supplying it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleItemInput'
            example:
              jobId: j1
              title: Final Walkthrough
              start: '2026-09-01'
              end: '2026-09-01'
      responses:
        '201':
          description: The created schedule item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItem'
        '400':
          description: One or more required fields (jobId, title, start, end) are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/schedule/{id}:
    parameters:
      - $ref: '#/components/parameters/ScheduleItemId'
    put:
      operationId: updateScheduleItem
      tags: [Schedule]
      summary: Update some of a schedule item's fields.
      description: |
        Updates the schedule item identified by `id`. **This is a partial
        update** — send only the fields you want to change and every other
        field keeps its stored value. (It used to be a full replace whose
        omitted fields reset to defaults, which silently wiped
        `predecessorIds`, `subIds` and `tags` on a title-only edit.) To
        clear a field, send it explicitly (e.g. `"notes": ""`).

        `jobId` in the request body is accepted but silently ignored — an
        item can never change which job it belongs to.

        DURATION: `start`, `end` and `workDays` are three views of two
        facts, and `workDays` counts WORKING days (Mon–Fri), so a 5-day
        task starting Thursday ends the following Wednesday. Send whichever
        pair you mean and the rest is derived:
          * `workDays` alone -> `end` is recomputed from `start`
          * `end` alone      -> `workDays` is recounted over the span
          * `start` alone    -> the item moves and keeps its duration
        Sending nothing date-related leaves all three untouched.

        VALIDATION (all `400`, with a message naming the problem): blank
        title; a date that isn't `YYYY-MM-DD`; `end` before `start`;
        `workDays` not an integer >= 1; `progress` outside 0–100; a
        predecessor that is unknown, duplicated, belongs to another job, or is
        this item itself; a link `type` other than FS/SS or a non-integer
        `lag`; and any edit that would create a dependency loop (the error
        names the loop).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleItemInput'
            example:
              progress: 40
      responses:
        '200':
          description: The updated schedule item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItem'
        '400':
          description: A field failed validation — see the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    # PATCH /api/schedule/{id} also works and is the same handler, but it is
    # deliberately NOT documented as its own operation: the spec is consumed by
    # OpenAPIToolset, so a second entry would generate a byte-identical tool and
    # make the model choose between two indistinguishable options for no gain.
    # Same treatment as the PATCH aliases on daily-logs and estimate-items.
    delete:
      operationId: deleteScheduleItem
      tags: [Schedule]
      summary: Delete a schedule item.
      description: Permanently deletes the schedule item identified by `id`. No response body on success.
      responses:
        '204':
          description: Deleted successfully. No response body.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/schedule/{id}/shifts:
    parameters:
      - $ref: '#/components/parameters/ScheduleItemId'
    get:
      operationId: listScheduleItemShifts
      tags: [Schedule]
      summary: Every recorded date change for one item, and why — newest first.
      description: |
        The item's shift history. Read this to answer "why did this move?"
        instead of inferring it from the current dates.

        `reason` is what a person typed at the time ("Rain delay — glazing crew
        pulled off site"). It's the most useful field here and worth quoting
        rather than paraphrasing.

        `role` matters as much as the dates. `direct` means someone moved THIS
        item. `cascade` means it moved because something it depends on moved —
        nobody edited it. Saying "we pushed MEP rough-in" when the record says
        `cascade` gets the story backwards; it followed the delay upstream.

        `alsoMoved` is how many other items moved in the same change, so a
        one-item nudge can be told apart from a nine-item ripple. `undone: true`
        means the change was later reverted and the dates it describes are no
        longer in effect — don't report it as current.

        Empty array means the item hasn't moved since it was created, which is
        worth saying plainly rather than treating as missing data.
      responses:
        '200':
          description: Shifts affecting this item, newest first. Empty if it has never moved.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    changeSetId: { type: string }
                    itemId: { type: string }
                    role:
                      type: string
                      enum: [direct, cascade]
                    origin:
                      type: string
                      description: What initiated it — a Gantt drag, a batch call, an approved impact.
                    reason: { type: string }
                    from:
                      type: object
                      properties:
                        start: { type: string, format: date }
                        end: { type: string, format: date }
                        workDays: { type: integer }
                    to:
                      type: object
                      properties:
                        start: { type: string, format: date }
                        end: { type: string, format: date }
                        workDays: { type: integer }
                    undone:
                      type: boolean
                      description: The change was reverted; these dates are no longer in effect.
                    alsoMoved:
                      type: integer
                      description: How many OTHER items moved in the same change.
                    createdBy: { type: string }
                    createdAt: { type: string, format: date-time }

  /api/schedule/cascade-preview:
    post:
      operationId: previewScheduleCascade
      tags: [Schedule]
      summary: Ask what would happen if schedule dates moved — writes nothing.
      description: |
        Answers "if these items moved, what else moves, and does the job finish
        later?" **This is read-only** — no schedule item is modified. Call it
        freely; it is the intended way to reason about a date change before
        proposing one.

        USE THIS INSTEAD OF DOING THE ARITHMETIC YOURSELF. Dependencies,
        durations, weekends and the critical path interact in ways that are easy
        to get wrong by hand, and a confidently wrong date is worse than no
        answer. Anything you compute yourself will disagree with what the Gantt
        shows the user.

        Each entry in `changes` names one item and how it moves — send
        `shiftDays` to push it (WORK days, so 2 on a Thursday lands Monday),
        `start` to place it on a date, and/or `workDays` to change its duration.
        Successors then move by the same rule, preserving whatever gap they
        already had, and never being pulled earlier than they already sit.

        Send `changes: []` for a pure read: you still get `projectEnd` and
        `criticalIds` for the job as it stands.

        Add `includeAnalysis: true` for per-item float. Float is what
        distinguishes "this slips 3 days and the job finishes 3 days later" from
        "this slips 3 days into slack it already had and the finish date does not
        move" — worth asking for whenever you intend to describe the impact of a
        delay, and worth omitting otherwise since it roughly doubles the reply.

        Items marked complete are never moved. If the ripple wanted to move one,
        it is reported in `conflicts` rather than silently ignored, and the items
        behind it are reported as blocked — so say so rather than claiming the
        dates changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CascadePreviewInput'
            example:
              jobId: j1
              changes:
                - itemId: s2
                  shiftDays: 2
      responses:
        '200':
          description: What would change. Nothing has been written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CascadePreviewResult'
        '400':
          description: |
            Unknown jobId, an unknown itemId, or a malformed `changes` entry —
            the message names which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            This job's stored dependencies contain a loop, so no ordering exists
            and nothing can be computed from them. `cycleIds` names the loop.
            Report it — it is a data problem for a human to fix, not something to
            retry or work around.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/schedule/batch:
    post:
      operationId: applyScheduleCascade
      tags: [Schedule]
      summary: Move schedule dates for real, cascading and undoable, in one write.
      description: |
        Applies date changes and the knock-on moves they cause, as ONE atomic
        write, recording a change set so the whole thing can be undone together.

        USE THIS FOR ANY DATE CHANGE, not updateScheduleItem. Moving a bar
        almost always pushes the work behind it, and updateScheduleItem moves
        exactly one item: use it for dates and you leave the schedule
        contradicting its own dependencies — a successor starting before the
        predecessor it waits on. Doing it as several updateScheduleItem calls is
        no better; one can fail after the others have landed, and there is no
        record tying them together to undo.

        Takes the same `changes` shape as previewScheduleCascade, so the normal
        sequence is: preview it, tell the user what moves, apply the identical
        payload once they agree. Preview first for anything beyond a single
        unblocked item — the ripple is often much larger than it looks.

        `reason` is shown to the user in the schedule's history, so write it for
        them ("Pushed framing 2 days for the rain delay"), not for the log.

        The response echoes the same shape the preview returned, plus the
        `changeSet` that was recorded and the job's full refreshed item list.
        Report what actually happened from `counts` and `projectEnd` rather than
        from what you intended — completed items are never moved, and any the
        ripple wanted to move come back in `conflicts`.

        A request that turns out to change nothing is a success with
        `changeSet: null`, not an error. Nothing was written, so say so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CascadeApplyInput'
            example:
              jobId: j1
              changes:
                - itemId: s2
                  shiftDays: 2
              reason: Pushed framing 2 days for the rain delay
      responses:
        '200':
          description: |
            Applied. `changeSet` is null when the request changed nothing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeSet:
                    $ref: '#/components/schemas/ScheduleChangeSet'
                  items:
                    type: array
                    description: The job's full schedule after the write.
                    items:
                      $ref: '#/components/schemas/ScheduleItem'
                  plan:
                    $ref: '#/components/schemas/CascadePreviewResult'
        '400':
          description: Unknown jobId, unknown itemId, or a malformed change entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            The job's dependencies contain a loop. Nothing was written. Report it
            rather than retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/workday-exceptions:
    get:
      operationId: listWorkdayExceptions
      tags: [Schedule]
      summary: Days this job does or doesn't work, beyond its standard work week.
      description: |
        Holidays and closures that BLOCK a normally-working day
        (`type: "non_workday"`), and extra days that OPEN a normally-off one
        (`type: "extra_workday"`) — a Saturday push, for instance.

        Read this before explaining a date. All schedule arithmetic already
        routes around these, so a task can appear to skip a Monday or run
        through a Saturday for a reason that is invisible in the item itself.
        If someone asks why a duration doesn't line up with the calendar, this
        is usually the answer.

        Includes both this job's own exceptions and company-wide ones (those
        come back with `jobId: ""`).

        An exception with `sameEveryYear: true` repeats annually — only its
        month and day matter, so a single row covers every Christmas and its
        stored year may be in the past.
      parameters:
        - $ref: '#/components/parameters/JobIdQuery'
      responses:
        '200':
          description: Exceptions affecting this job, earliest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkdayException'
        '400':
          $ref: '#/components/responses/MissingJobId'

  /api/baselines:
    get:
      operationId: getScheduleBaseline
      tags: [Schedule]
      summary: How the schedule compares to the plan that was agreed.
      description: |
        The baseline is a frozen copy of the schedule from when the plan was
        agreed. This returns it plus a LIVE comparison against today's dates —
        which is how to answer "are we behind schedule, and where".

        Read this before making claims about being ahead or behind. Comparing
        current dates against your own sense of the plan is guesswork; this is
        the recorded plan.

        `summary.projectEnd.slip` is the number that matters: calendar days the
        finish has moved, POSITIVE meaning later than planned. `summary.worst`
        points at the single item that has slipped furthest, which is usually
        what to talk about first.

        Per-item, `status` is judged on the FINISH, not the start — an item that
        started late but finished on time has cost the project nothing, and one
        that started on time but ran long has. `startSlip`/`endSlip` are
        calendar days; `durationDelta` is working days.

        Two statuses have no slip to report and should be described as scope
        change rather than delay: `added` (created after the baseline — this is
        how scope creep shows up) and `removed` (was in the plan, since
        deleted).

        `baseline: null` means none has been set yet. That is a normal state,
        not an error — say so rather than inferring drift from nothing. Setting
        one is a deliberate decision made on the Schedule page's Baseline tab,
        and there is no tool for it.
      parameters:
        - $ref: '#/components/parameters/JobIdQuery'
      responses:
        '200':
          description: The active baseline and a live comparison against it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineComparison'
        '400':
          $ref: '#/components/responses/MissingJobId'

  /api/estimate:
    get:
      operationId: getEstimate
      tags: [Estimate]
      summary: Get a job's full estimate worksheet (all groups, items, and totals).
      description: |
        Returns every estimate group for the job, each with its line
        items (financial fields freshly computed on every read — see
        EstimateItem) and per-group totals, plus a job-wide totals object
        summed across every item in every group.

        Special case — a job with **zero real (persisted) groups** gets a
        single synthetic placeholder group instead of an empty array:
        `{id: "unassigned", jobId, name: "Unassigned", sortOrder: 0,
        virtual: true, items: [], totals: {...all zero}}`. This group has
        **no `createdAt` key at all** (not `null` — the key is simply
        absent) since it was never actually written to the database. It
        disappears automatically and permanently the moment
        createEstimateItem or createEstimateGroup is called for that job
        (see createEstimateItem's description) — you cannot delete it
        directly via deleteEstimateGroup (it has no id in the database to
        delete; calling deleteEstimateGroup with id "unassigned" will 404).
      parameters:
        - $ref: '#/components/parameters/JobIdQuery'
      responses:
        '200':
          description: The job's full estimate worksheet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEstimateResponse'
        '400':
          $ref: '#/components/responses/MissingJobId'

  /api/estimate/groups:
    post:
      operationId: createEstimateGroup
      tags: [Estimate]
      summary: Create a new named estimate group for a job.
      description: |
        Creates a group (a named section of the estimate worksheet, e.g.
        "Foundation" or "Framing") for the given job. Returns the bare
        group object only — **no `items` or `totals` keys** (those only
        ever appear on a group as returned nested inside getEstimate's
        response, once it has items). A freshly created group therefore
        starts out with no items; use createEstimateItem with this
        group's `id` as `groupId` to add line items to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateGroupInput'
            example:
              jobId: j1
              name: Foundation
      responses:
        '201':
          description: The created group (bare — no items/totals yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateGroup'
        '400':
          description: jobId and/or name are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/estimate/groups/{id}:
    parameters:
      - $ref: '#/components/parameters/EstimateGroupId'
    delete:
      operationId: deleteEstimateGroup
      tags: [Estimate]
      summary: Delete an estimate group and every line item inside it.
      description: |
        Permanently deletes the group identified by `id`. **This cascades
        — every estimate item currently assigned to this group is deleted
        along with it**, not just unassigned. There is no "move these
        items to another group first" safety step; if you want to
        preserve the items, reassign them (updateEstimateItem with a
        different `groupId`) before deleting the group.
      responses:
        '204':
          description: Deleted successfully (group and its items). No response body.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/estimate/items:
    post:
      operationId: createEstimateItem
      tags: [Estimate]
      summary: Create a new estimate line item for a job.
      description: |
        Creates a line item and returns it with server-computed financial
        fields (builderCost, unitPrice, clientPrice, profit, margin —
        see EstimateItemFinancials). Only `jobId` and `name` are strictly
        enforced by the server; `costCode` is modeled as required in this
        spec to match the real UI's save-button validation, but the
        server currently accepts it missing (defaults to an empty
        string) — supply it anyway to match the intended contract.

        Side effect — group auto-creation ("materialization"): if
        `groupId` is omitted (or sent as the literal string
        `"unassigned"`), one of two things happens: (1) if the job
        currently has **zero real groups**, the server transparently
        creates a real "Unassigned" group and assigns this item to it —
        you never have to call createEstimateGroup first, the first item
        you create for a brand-new job's estimate is enough; (2) if the
        job **already has** one or more real groups, the item is instead
        assigned to the job's first existing group (by sort order) — it
        does NOT create a second "Unassigned" group alongside real ones.
        To target a specific existing group, pass its real `id` as
        `groupId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateItemInput'
            example:
              jobId: j1
              name: Poured foundation
              costCode: '03 Concrete'
              quantity: 1
              unitCost: 12000
              markupPercent: 15
      responses:
        '201':
          description: The created item, including freshly computed financial fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateItem'
        '400':
          description: jobId and/or name are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/estimate/items/{id}:
    parameters:
      - $ref: '#/components/parameters/EstimateItemId'
    put:
      operationId: updateEstimateItem
      tags: [Estimate]
      summary: Update an existing estimate line item.
      description: |
        Partial update: only the fields you send are changed, and every
        field you omit keeps its currently stored value. To clear a field,
        send it explicitly (`""`, `[]`, `false`). Previously this was a full
        replace, which meant a name-only edit silently reset quantity,
        unitCost, markupPercent and internalNotes to their defaults.

        `jobId` cannot be changed (ignored if sent). Financial fields in the
        response
        (builderCost/unitPrice/clientPrice/profit/margin) are always
        freshly recomputed from the saved quantity/unitCost/markupPercent
        — you cannot set them directly.

        If you send a `groupId`, the same materialization behavior as
        createEstimateItem applies (see that operation's description).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateItemInput'
      responses:
        '200':
          description: The updated item, including freshly computed financial fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateItem'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteEstimateItem
      tags: [Estimate]
      summary: Delete an estimate line item.
      description: Permanently deletes the estimate item identified by `id`. Does not affect its group. No response body on success.
      responses:
        '204':
          description: Deleted successfully. No response body.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/estimate/items/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/EstimateItemId'
    post:
      operationId: duplicateEstimateItem
      tags: [Estimate]
      summary: Duplicate an existing estimate line item.
      description: |
        Creates a copy of the item identified by `id`. **Takes no request
        body** — any body sent is ignored, only the path parameter
        matters.

        Copies every field from the source item verbatim (groupId,
        costCode, quantity, unitCost, markupPercent, taxable, etc. — the
        duplicate lands in the exact same group) except: a new `id` is
        generated, `name` becomes `"<original name> (Copy)"`, and
        `createdAt`/`updatedAt` are reset to the current time.
      responses:
        '201':
          description: The duplicated item, including freshly computed financial fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateItem'
        '404':
          description: No item exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/daily-logs:
    get:
      operationId: listDailyLogs
      tags: [Daily Logs]
      summary: List a job's daily logs, newest first.
      description: |
        Returns the job's daily logs ordered by log date descending, then id
        descending. Returns an empty array (not an error) for a job with no
        logs or an unknown jobId.

        Every filter parameter is optional and they combine with AND. Each
        returned log carries derived `likeCount`, `likedByMe` and
        `commentCount` fields, but NOT the comment bodies — fetch a single
        log with getDailyLog for those.

        Drafts are included by default; pass `status=draft` or
        `status=published` to narrow.
      parameters:
        - $ref: '#/components/parameters/JobIdQuery'
        - name: sharedWith
          in: query
          description: |
            Filter by audience. "internal", "subs" and "client" each match logs
            shared with that audience AND not marked private; "private" matches
            only private logs. Omit or pass "all" for no audience filter.
          schema:
            type: string
            enum: [all, internal, subs, client, private]
        - name: keywords
          in: query
          description: Case-insensitive substring match against the log's title, notes and tags.
          schema:
            type: string
        - name: createdBy
          in: query
          description: Case-insensitive substring match against the author's name.
          schema:
            type: string
        - name: dateRange
          in: query
          description: |
            Named relative range, resolved against the server's current date
            (inclusive on both ends). Use startDate/endDate instead for an
            explicit window; if both are supplied they narrow each other.
          schema:
            type: string
            enum: [all, today, yesterday, last7, last30, thisMonth, future]
        - name: startDate
          in: query
          description: Only logs dated on or after this day (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Only logs dated on or before this day (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published]
        - name: tag
          in: query
          description: |
            Exact (case-insensitive) tag match. Repeat the parameter to pass
            several — a log matches if it carries ANY of them, not all.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: The job's daily logs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyLog'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      operationId: createDailyLog
      tags: [Daily Logs]
      summary: Create a daily log.
      description: |
        Creates a log and returns it, including its generated id ("dl100",
        "dl101", ...) and its comments array (always empty on creation).

        Side effect worth knowing: if `includeWeather` is true (the default),
        the server snapshots the weather for `jobId`/`date` at write time and
        stores it on the log. It is NOT re-derived on read, so the log keeps
        showing the conditions for its day even after the date passes.

        `jobId` and `date` are required; everything else falls back to the
        column defaults. `title` is truncated to 50 characters and `notes` to
        4000 — over-long values are silently trimmed rather than rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyLogInput'
      responses:
        '201':
          description: The created log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLog'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/daily-logs/weather:
    get:
      operationId: getDailyLogWeather
      tags: [Daily Logs]
      summary: Preview the weather for a job and day.
      description: |
        Returns the weather reading the server would snapshot onto a log for
        this job and date. Purely derived and side-effect free — the same
        (jobId, date) always returns the same reading, and calling this does
        not create or modify anything.

        Used by the add/edit form to show the forecast before the log is
        saved. The same function is exposed to MCP clients as the
        `get_jobsite_weather` tool (server/mcp.js).
      parameters:
        - $ref: '#/components/parameters/JobIdQuery'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The weather reading.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Weather'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/daily-logs/tags:
    get:
      operationId: listDailyLogTags
      tags: [Daily Logs]
      summary: List the distinct tags used on a job's daily logs.
      description: |
        Returns the sorted, de-duplicated set of tags across the job's logs.
        Backs tag autocomplete and the filter drawer's tag chips — it only
        ever returns tags that can actually match something.
      parameters:
        - $ref: '#/components/parameters/JobIdQuery'
      responses:
        '200':
          description: Sorted distinct tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/daily-logs/{id}:
    get:
      operationId: getDailyLog
      tags: [Daily Logs]
      summary: Get one daily log, including its comments.
      description: |
        Same shape as a list entry plus a `comments` array ordered oldest
        first. This is the only endpoint that returns comment bodies.
      parameters:
        - $ref: '#/components/parameters/DailyLogId'
      responses:
        '200':
          description: The daily log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLog'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateDailyLog
      tags: [Daily Logs]
      summary: Update a daily log.
      description: |
        Partial update: only the fields you send are changed, and every field
        you omit keeps its currently stored value. To clear a field, send it
        explicitly (`""`, `[]`, `false`). `date` is NOT required — omit it and
        the log keeps the day it already had.

        This used to be a full replace, which made a notes-only edit reset
        `photos` and `tags`, and — because `status` defaulted to `published` —
        silently promote a draft.

        Two fields are deliberately NOT updatable here: `jobId` (a log cannot
        be moved between jobs) and `likes` (owned solely by toggleDailyLogLike,
        so an edit can't clobber other people's likes). `attachments` is
        read-only.

        Weather is re-snapshotted only when `date` changed or when weather was
        previously absent and `includeWeather` is now true; setting
        `includeWeather` to false clears it. An unrelated edit therefore won't
        silently rewrite the recorded conditions.
      parameters:
        - $ref: '#/components/parameters/DailyLogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyLogInput'
      responses:
        '200':
          description: The updated log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteDailyLog
      tags: [Daily Logs]
      summary: Delete a daily log and its comments.
      description: |
        Permanently deletes the log and cascades to its comments. There is no
        soft-delete, undo or trash — this is irreversible.
      parameters:
        - $ref: '#/components/parameters/DailyLogId'
      responses:
        '204':
          description: Deleted. No body.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/daily-logs/{id}/like:
    post:
      operationId: toggleDailyLogLike
      tags: [Daily Logs]
      summary: Toggle the current user's like on a daily log.
      description: |
        A toggle, not an increment: calling it once likes the log, calling it
        again un-likes it. There is no auth layer, so "the current user" is
        always the hard-coded "Ruhaab Markas" (dailyLogRoutes.CURRENT_USER).
        Takes no request body. Returns the full updated log.
      parameters:
        - $ref: '#/components/parameters/DailyLogId'
      responses:
        '200':
          description: The updated log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLog'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/daily-logs/{id}/comments:
    post:
      operationId: addDailyLogComment
      tags: [Daily Logs]
      summary: Add a comment to a daily log.
      description: |
        Appends a comment authored by the hard-coded current user and returns
        the full updated log (with the new comment in `comments`), not the
        comment on its own. Whitespace-only bodies are rejected with a 400.
      parameters:
        - $ref: '#/components/parameters/DailyLogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: The comment text. Must contain non-whitespace.
              required: [body]
      responses:
        '201':
          description: The updated log, including the new comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/daily-logs/comments/{id}:
    delete:
      operationId: deleteDailyLogComment
      tags: [Daily Logs]
      summary: Delete a single comment.
      description: |
        Deletes the comment and returns the full updated parent log — note
        this returns 200 with a body, not the 204 that deleteDailyLog returns.
      parameters:
        - name: id
          in: path
          required: true
          description: The comment's id, e.g. "dlc100".
          schema:
            type: string
      responses:
        '200':
          description: The updated parent log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLog'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/daily-log-settings:
    get:
      operationId: getDailyLogSettings
      tags: [Daily Logs]
      summary: Get the company-wide daily log settings.
      description: |
        A single company-wide record (there is no per-job override). These are
        defaults applied to NEW logs at compose time by the frontend — changing
        them never rewrites logs that already exist.
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLogSettings'

    put:
      operationId: updateDailyLogSettings
      tags: [Daily Logs]
      summary: Update the company-wide daily log settings.
      description: |
        Shallow-merges the body over the current settings, and merges `share`
        and `notify` one level deeper — so `{"share": {"client": true}}` leaves
        `share.subs` alone. Returns the full merged settings.

        `share.internal` is forced to true and cannot be cleared: every log is
        at minimum visible internally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyLogSettings'
      responses:
        '200':
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLogSettings'


components:
  parameters:
    JobIdQuery:
      name: jobId
      in: query
      required: true
      description: |
        The job to scope this request to, e.g. "j1". Jobs themselves are
        static frontend fixtures (src/data/jobs.js), not part of this
        API — this parameter is a soft reference with no server-side
        existence check (an unknown jobId returns an empty result, not
        a 404).
      schema:
        type: string
        example: j1
    ScheduleItemId:
      name: id
      in: path
      required: true
      description: The schedule item's id, e.g. "s100".
      schema:
        type: string
    EstimateGroupId:
      name: id
      in: path
      required: true
      description: |
        The estimate group's id, e.g. "eg100". `unassigned` is the synthetic
        placeholder group's id — it has no database row, so passing it here
        404s (getEstimate does return it, which is why it looks addressable).
      schema:
        type: string
    EstimateItemId:
      name: id
      in: path
      required: true
      description: The estimate item's id, e.g. "ei100".
      schema:
        type: string
    DailyLogId:
      name: id
      in: path
      required: true
      description: The daily log's id, e.g. "dl100".
      schema:
        type: string

  responses:
    MissingJobId:
      description: The required `jobId` query parameter was not provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No resource exists with the given id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: |
        A required field or query parameter was missing or invalid. The
        `error` string names what was wrong.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      description: Shape of every 400/404/500 response across this whole API.
      properties:
        error:
          type: string
          description: Human-readable explanation of what went wrong.
      required: [error]

    # ---------- Schedule ----------

    ScheduleItem:
      type: object
      description: A schedule item (task or milestone) as returned by the API.
      properties:
        id:
          type: string
          description: Server-generated identifier, e.g. "s100". Read-only.
        jobId:
          type: string
          description: The job this item belongs to. Set on create; cannot be changed afterward (ignored on update).
        title:
          type: string
        color:
          type: string
          description: |
            Display color name. Observed live in the real product's
            "Display Color" dropdown, but capture was cut off before the
            full list was seen — treat this enum as a confirmed subset,
            not exhaustive. Any string is accepted server-side even if
            outside this list.
          enum: [Maroon, Merlot, Tuscan Red, Rose, Victoria, Brown, Coffee, Amber, Alarm Lime]
        assignees:
          type: string
          description: Free-text assignee field (a single string, not a list, despite the plural name — matches the real product's single text input here).
        start:
          type: string
          format: date
          description: Start date, YYYY-MM-DD.
        end:
          type: string
          format: date
          description: End date, YYYY-MM-DD.
        workDays:
          type: integer
          description: Duration in work days (or hours, if `hourly` is true — the unit isn't tracked separately, just this one number).
        hourly:
          type: boolean
          description: If true, `workDays` is interpreted as hours instead of days (display-only distinction; no different date math is applied).
        progress:
          type: integer
          description: Percent complete, 0-100. Not server-validated to that range.
        reminder:
          type: string
          description: |
            Observed live in the real product's "Reminder" dropdown, but
            capture was cut off before the full list was seen — confirmed
            subset, not exhaustive.
          enum: ['None', '1 Hour Before', '2 Hours Before', '4 Hours Before', '8 Hours Before', '12 Hours Before', '1 Day Before', '2 Days Before']
        complete:
          type: boolean
        phase:
          type: string
          description: |
            Invented for this mock, NOT observed in the real product — the
            real "Phase" dropdown has "Add"/"Edit" links implying a
            per-job configurable list, which this prototype doesn't model.
          enum: [Unassigned, Site Work, Foundation, Framing, MEP Rough-In, Finishes]
        tags:
          type: array
          items:
            type: string
        showOnGantt:
          type: boolean
        showClient:
          type: boolean
          description: Whether this item is visible on the client-facing "Full schedule" view.
        subIds:
          type: array
          items:
            type: string
          description: Ids of subs/vendors (src/data/subsVendors.js) with viewing access to this item.
        predecessors:
          type: array
          description: |
            What this item waits on. THIS is the field to write; it drives the
            Gantt's dependency arrows, the Critical Path toggle, and the
            cascade that shifts downstream work when a date moves.
          items:
            $ref: '#/components/schemas/PredecessorLink'
        predecessorIds:
          type: array
          items:
            type: string
          description: |
            Read-only convenience: just the ids from `predecessors`, for when
            you only need "what does this wait on" and don't care about link
            types. DERIVED on every read, so it can never disagree with
            `predecessors` — write to that field instead. Anything sent here is
            treated as finish-to-start with zero lag.
        notes:
          type: string
          description: |
            "All Notes" — visible to the internal team, subs/vendors AND clients.
            The widest audience, so don't put anything internal here.
        internalNotes:
          type: string
          description: '"Internal Notes" — internal team only. Never shown to subs or clients.'
        subNotes:
          type: string
          description: '"Sub Notes" — internal team and subs/vendors. Not clients.'
        clientNotes:
          type: string
          description: '"Client Notes" — internal team and clients. Not subs.'
        createdBy:
          type: string
          description: Always a fixed server-set demo user name, regardless of request input. Read-only.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp. Read-only.
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp, refreshed on every update. Read-only.
      required: [id, jobId, title, color, assignees, start, end, workDays, hourly, progress, reminder, complete, phase, tags, showOnGantt, showClient, subIds, predecessors, predecessorIds, notes, internalNotes, subNotes, clientNotes, createdBy, createdAt, updatedAt]

    ScheduleItemInput:
      type: object
      description: |
        Request body for createScheduleItem and updateScheduleItem.
        Same fields as ScheduleItem minus the four server-assigned,
        read-only fields (id, createdBy, createdAt, updatedAt).
      properties:
        jobId:
          type: string
          description: 'On update: accepted but ignored — an item cannot change jobs.'
        title:
          type: string
        color:
          type: string
          enum: [Maroon, Merlot, Tuscan Red, Rose, Victoria, Brown, Coffee, Amber, Alarm Lime]
          default: Victoria
        assignees:
          type: string
          default: ''
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        workDays:
          type: integer
          default: 1
        hourly:
          type: boolean
          default: false
        progress:
          type: integer
          default: 0
        reminder:
          type: string
          enum: ['None', '1 Hour Before', '2 Hours Before', '4 Hours Before', '8 Hours Before', '12 Hours Before', '1 Day Before', '2 Days Before']
          default: 'None'
        complete:
          type: boolean
          default: false
        phase:
          type: string
          enum: [Unassigned, Site Work, Foundation, Framing, MEP Rough-In, Finishes]
          default: Unassigned
        tags:
          type: array
          items:
            type: string
          default: []
        showOnGantt:
          type: boolean
          default: true
        showClient:
          type: boolean
          default: true
        subIds:
          type: array
          items:
            type: string
          default: []
        predecessors:
          type: array
          items:
            $ref: '#/components/schemas/PredecessorLink'
          default: []
          description: |
            What this item waits on. Send the whole array — it replaces the
            item's links, so omitting it on an update leaves them alone but
            sending a shorter array removes the ones you left out.

            Rejected with 400 if an id is unknown, belongs to another job, is
            this item itself, is linked twice, carries a type other than FS/SS
            or a non-integer lag, or would create a dependency loop.
        predecessorIds:
          type: array
          items:
            type: string
          default: []
          description: |
            Shorthand accepted in place of `predecessors`: bare ids, each read
            as finish-to-start with zero lag. Prefer `predecessors` unless you
            genuinely mean plain FS links with no lag.
        notes:
          type: string
          default: ''
          description: |
            "All Notes" — the internal team, subs/vendors AND clients can read
            this. Use one of the narrower fields below if the audience matters.
        internalNotes:
          type: string
          default: ''
          description: '"Internal Notes" — internal team only.'
        subNotes:
          type: string
          default: ''
          description: '"Sub Notes" — internal team and subs/vendors, not clients.'
        clientNotes:
          type: string
          default: ''
          description: '"Client Notes" — internal team and clients, not subs.'
      required: [jobId, title, start, end]

    CascadePreviewInput:
      type: object
      description: Request body for previewScheduleCascade.
      properties:
        jobId:
          type: string
          description: The job whose schedule to reason about.
        changes:
          type: array
          description: |
            The moves to test. Empty array is valid and means "just tell me about
            the schedule as it stands".
          items:
            $ref: '#/components/schemas/CascadeChangeRequest'
          default: []
        mode:
          type: string
          description: |
            `rigid` (default) moves successors by the full delta, keeping the gap
            they already had — what a superintendent expects when a chain slips.
            `float-aware` moves a successor only once its own slack is used up,
            which produces a smaller ripple.
          enum: [rigid, float-aware]
          default: rigid
        includeAnalysis:
          type: boolean
          description: Include per-item float (see the operation description).
          default: false
      required: [jobId]

    CascadeChangeRequest:
      type: object
      description: |
        One item and how it moves. Needs at least one of `shiftDays`, `start` or
        `workDays`; sending only `itemId` is an error, since it asks for no change.
      properties:
        itemId:
          type: string
          description: Id of a schedule item on this job.
        shiftDays:
          type: integer
          description: |
            Push out by this many WORK days (negative pulls earlier). 2 on a
            Thursday lands the following Monday — weekends are skipped rather
            than absorbing the delay.
        start:
          type: string
          format: date
          description: Place the item on this exact date instead of shifting it.
        workDays:
          type: integer
          description: Change the duration, in working days. The end date is re-derived.
      required: [itemId]

    CascadePreviewResult:
      type: object
      description: |
        The consequences of the requested moves. Nothing here has been written —
        to actually apply it, a human approves it in the Impacts panel.
      properties:
        ok:
          type: boolean
        mode:
          type: string
          enum: [rigid, float-aware]
        changes:
          type: array
          description: |
            Every item whose dates would change, including the ones you asked for
            (`role: direct`) and the ones that move as a consequence
            (`role: cascade`). An empty array means the moves changed nothing.
          items:
            type: object
            properties:
              itemId: { type: string }
              title: { type: string }
              role:
                type: string
                enum: [direct, cascade]
              from: { $ref: '#/components/schemas/CascadeDates' }
              to: { $ref: '#/components/schemas/CascadeDates' }
              deltaDays:
                type: integer
                description: |
                  Calendar days the start moved. Can exceed the work-day shift you
                  asked for when the move crosses a weekend — a 2-work-day push on
                  a Thursday is +4 calendar days.
        conflicts:
          type: array
          description: |
            Items the ripple wanted to move but could not, with the reason. A
            completed item is never moved. Report these rather than implying the
            dates changed.
          items:
            type: object
            properties:
              itemId: { type: string }
              title: { type: string }
              reason:
                type: string
                enum: [complete]
              wantedStart: { type: string, format: date }
              currentStart: { type: string, format: date }
        warnings:
          type: array
          description: Items that did move but deserve a caveat — e.g. work already under way.
          items:
            type: object
            properties:
              itemId: { type: string }
              title: { type: string }
              reason:
                type: string
                enum: [in_progress]
              progress: { type: integer }
        counts:
          type: object
          description: How many items moved directly vs. as a knock-on effect.
          properties:
            direct: { type: integer }
            cascade: { type: integer }
        projectEnd:
          type: object
          description: |
            The job's finish date before and after. `deltaDays` of 0 means the
            slip was absorbed by existing slack and the job still finishes on
            time — the single most useful number here.
          properties:
            before: { type: string, format: date }
            after: { type: string, format: date }
            deltaDays: { type: integer }
        criticalIds:
          type: array
          description: Items on the critical path AFTER the moves — no slack, so any further slip moves the finish date.
          items: { type: string }
        analysis:
          type: array
          description: Present only when `includeAnalysis` was true. Float is in work days.
          items:
            type: object
            properties:
              itemId: { type: string }
              totalFloat:
                type: integer
                description: Work days this can slip before the job's finish date moves.
              freeFloat:
                type: integer
                description: Work days this can slip before any successor moves.
              critical: { type: boolean }
      required: [ok, changes, conflicts, warnings, counts, projectEnd, criticalIds]

    BaselineComparison:
      type: object
      properties:
        baseline:
          type: object
          description: Null when no baseline has been set for this job.
          properties:
            id: { type: string }
            jobId: { type: string }
            name: { type: string }
            projectEnd:
              type: string
              format: date
              description: The project finish at the moment the baseline was captured.
            itemCount: { type: integer }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
        rows:
          type: array
          description: One row per item, in date order. Empty when no baseline is set.
          items:
            type: object
            properties:
              itemId: { type: string }
              title: { type: string }
              status:
                type: string
                enum: [behind, ahead, on_plan, added, removed]
              baseline:
                type: object
                description: Planned dates. Null for an item added after the baseline.
                properties:
                  start: { type: string, format: date }
                  end: { type: string, format: date }
                  workDays: { type: integer }
              current:
                type: object
                description: Today's dates. Null for an item deleted since the baseline.
                properties:
                  start: { type: string, format: date }
                  end: { type: string, format: date }
                  workDays: { type: integer }
              startSlip:
                type: integer
                description: Calendar days the start has moved; positive is late.
              endSlip:
                type: integer
                description: Calendar days the finish has moved; positive is late.
              durationDelta:
                type: integer
                description: Change in duration, in WORKING days; positive means it now takes longer.
        summary:
          type: object
          description: Null when no baseline is set.
          properties:
            behind: { type: integer }
            ahead: { type: integer }
            onPlan: { type: integer }
            added: { type: integer }
            removed: { type: integer }
            projectEnd:
              type: object
              properties:
                baseline: { type: string, format: date }
                current: { type: string, format: date }
                slip:
                  type: integer
                  description: Calendar days the finish has moved. The headline number.
            worst:
              type: object
              description: The item that has slipped furthest, or null if nothing has.
      required: [baseline, rows, summary]

    WorkdayException:
      type: object
      description: |
        One override on a job's standard work week. Read-only through the API —
        creating and editing these is done on the Schedule page's Workday
        Exceptions tab.
      properties:
        id: { type: string }
        jobId:
          type: string
          description: The job this applies to. `""` means every job (a public holiday).
        title:
          type: string
          description: What it is, e.g. "Thanksgiving" or "Saturday push to catch up".
        type:
          type: string
          description: |
            `non_workday` blocks a day that would normally work — nothing can be
            scheduled on it. `extra_workday` opens a day that normally wouldn't.
          enum: [non_workday, extra_workday]
        start: { type: string, format: date }
        end:
          type: string
          format: date
          description: Inclusive. Equal to `start` for a single day.
        sameEveryYear:
          type: boolean
          description: |
            Repeats annually — only month and day are compared, so the stored
            year may be in the past and still apply.
        category:
          type: string
          description: Free-text grouping, e.g. "Holiday".
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, jobId, title, type, start, end, sameEveryYear, category, createdBy, createdAt, updatedAt]

    PredecessorLink:
      type: object
      description: |
        One dependency: this item waits on `id`, in the manner given by `type`,
        offset by `lag` working days.
      properties:
        id:
          type: string
          description: A schedule item on the same job. Must not be this item, and must not close a loop.
        type:
          type: string
          description: |
            `FS` (finish-to-start) — the predecessor must FINISH first. The
            common case: framing waits on the foundation.

            `SS` (start-to-start) — the two START together, or this one can't
            start until the other has. Use it for trades that genuinely run
            side by side, like electrical and plumbing rough-in sharing the
            same walls. An SS successor does NOT wait for the predecessor to
            finish, so don't reach for it just to make two bars overlap.
          enum: [FS, SS]
          default: FS
        lag:
          type: integer
          description: |
            Working days of offset, and it may be NEGATIVE.

            Positive is lag — wait this long after the predecessor's finish (FS)
            or start (SS). Use it for cure and dry time: concrete before
            framing, stucco before the next coat. A cure window is calendar
            time and cannot be shortened by adding crew.

            Negative is lead — start this many working days EARLIER, i.e.
            before the predecessor is done. `lag: -1` on an FS link means
            "start a day before the drywall is finished".

            Zero means the next working day after the predecessor finishes
            (FS), or the same day it starts (SS).
          default: 0
      required: [id]

    CascadeApplyInput:
      type: object
      # Deliberately a flat copy of CascadePreviewInput plus reason/origin,
      # rather than `allOf` composing the two. ADK's OpenAPI-to-tool parser does
      # not flatten allOf in a requestBody, so composing produced a tool with no
      # jobId parameter at all — the endpoint worked under curl while the agent
      # got "jobId is required" on every attempt. Keep these two in sync by hand.
      description: Request body for applyScheduleCascade.
      properties:
        jobId:
          type: string
          description: The job whose schedule to change.
        changes:
          type: array
          description: The moves to apply. Same shape as previewScheduleCascade.
          items:
            $ref: '#/components/schemas/CascadeChangeRequest'
          default: []
        mode:
          type: string
          description: |
            `rigid` (default) moves successors by the full delta, keeping their
            existing gap. `float-aware` moves one only once its slack is used up.
          enum: [rigid, float-aware]
          default: rigid
        reason:
          type: string
          description: |
            Human-facing note shown in the schedule's history. Write it for the
            user ("Pushed framing 2 days for the rain delay"), not for a log.
          default: ''
        origin:
          type: string
          description: What initiated this. Use 'batch' from an agent.
          enum: [batch, gantt_drag, gantt_edit, impact_approve]
          default: batch
      required: [jobId, changes]

    ScheduleChangeSet:
      type: object
      description: |
        One atomic batch of schedule writes, with the prior value of everything
        it touched — which is what makes it undoable as a unit.
      properties:
        id:
          type: string
          description: e.g. "cs100". Undo is a UI action; there is no tool for it.
        jobId: { type: string }
        origin:
          type: string
          enum: [batch, gantt_drag, gantt_edit, impact_approve, undo]
        originRef:
          type: string
          description: For an undo, the id of the change set it reverted.
        reason: { type: string }
        counts:
          type: object
          properties:
            direct: { type: integer }
            cascade: { type: integer }
        projectEnd:
          type: object
          properties:
            before: { type: string, format: date }
            after: { type: string, format: date }
        undoneBy:
          type: string
          description: Id of the change set that reverted this one; '' if still in effect.
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, jobId, origin, counts, projectEnd, createdBy, createdAt]

    CascadeDates:
      type: object
      description: An item's start, end and duration.
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        workDays:
          type: integer
          description: Duration in WORKING days, so end is not simply start + workDays.
      required: [start, end, workDays]

    # ---------- Estimate ----------

    EstimateGroup:
      type: object
      description: A bare estimate group, as returned by createEstimateGroup (no items/totals — see EstimateGroupWithItems for the nested-in-getEstimate shape).
      properties:
        id:
          type: string
          description: e.g. "eg100", or the literal "unassigned" for the synthetic placeholder (which is never returned by this bare schema — only by EstimateGroupWithItems).
        jobId:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, jobId, name, sortOrder, createdAt]

    EstimateGroupInput:
      type: object
      description: Request body for createEstimateGroup.
      properties:
        jobId:
          type: string
        name:
          type: string
      required: [jobId, name]

    EstimateGroupWithItems:
      type: object
      description: |
        A group as it appears nested inside getEstimate's response —
        EstimateGroup's fields plus items and totals, and (only for the
        synthetic placeholder group) a `virtual` flag with `createdAt`
        entirely absent.
      # Deliberately NOT `allOf: [EstimateGroup, ...]`: EstimateGroup marks
      # `createdAt` required, but the synthetic "Unassigned" group has no
      # database row and therefore no createdAt — so inheriting that required
      # list made getEstimate violate its own response schema for every job
      # with an empty estimate. Spelled out here with createdAt optional.
      properties:
        id:
          type: string
        jobId:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
          description: Absent entirely on the synthetic "Unassigned" group.
      allOf:
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EstimateItem'
            totals:
              $ref: '#/components/schemas/EstimateTotals'
            virtual:
              type: boolean
              description: |
                Present and `true` ONLY on the synthetic "Unassigned"
                placeholder group returned when a job has zero real
                groups (see getEstimate). Absent entirely — not `false`
                — on every real, persisted group.
          required: [id, jobId, name, sortOrder, items, totals]

    EstimateItemBase:
      type: object
      description: The DB-backed fields of an estimate line item (see EstimateItemFinancials for the 5 computed-on-read fields added on top of these).
      properties:
        id:
          type: string
          description: e.g. "ei100". Read-only.
        jobId:
          type: string
        groupId:
          type: string
          description: The group this item belongs to. See createEstimateItem's description for what happens when this is omitted.
        name:
          type: string
        costCode:
          type: string
          description: |
            Optional. Leave it blank (`""`) if you do not know the code —
            do NOT guess: a wrong cost code misfiles the job's costs, which
            is worse than an unset one, and the blank can be corrected later.

            Only "00 Preconstruction Services" was directly observed live;
            the rest of this list is the app's seeded working set, not a
            confirmed exhaustive real catalog, and the server accepts values
            outside it.
          enum:
            - ''
            - '00 Preconstruction Services'
            - '01 General Conditions'
            - '02 Site Work'
            - '03 Concrete'
            - '06 Wood & Plastics'
            - '07 Thermal & Moisture Protection'
            - '08 Doors & Windows'
            - '09 Finishes'
            - '10 Specialties'
            - '11 Equipment'
            - '12 Furnishings'
            - '22 Plumbing'
            - '23 HVAC'
            - '26 Electrical'
            - '32 Exterior Improvements'
        description:
          type: string
        internalNotes:
          type: string
        quantity:
          type: number
          format: float
        unit:
          type: string
          description: Free-text unit of measure, e.g. "EA", "SF", "HR".
        unitCost:
          type: number
          format: float
        costType:
          type: string
          description: Only "None" was directly observed live; the other values are plausible but invented.
          enum: [None, Labor, Material, Sub, Equipment, Other]
        markupPercent:
          type: number
          format: float
          description: Percentage points, e.g. 25 means 25%, not 0.25.
        taxable:
          type: boolean
        sortOrder:
          type: integer
        createdBy:
          type: string
          description: Always a fixed server-set demo user name. Read-only.
        createdAt:
          type: string
          format: date-time
          description: Read-only.
        updatedAt:
          type: string
          format: date-time
          description: Read-only.
      required: [id, jobId, groupId, name, costCode, description, internalNotes, quantity, unit, unitCost, costType, markupPercent, taxable, sortOrder, createdBy, createdAt, updatedAt]

    EstimateItemFinancials:
      type: object
      description: |
        Fields computed fresh on every read from quantity/unitCost/
        markupPercent — never stored, never settable directly. Sending
        these in a request body is harmless (silently ignored) but has
        no effect.
      properties:
        builderCost:
          type: number
          description: quantity × unitCost, rounded to 2 decimal places.
        unitPrice:
          type: number
          description: unitCost × (1 + markupPercent / 100), rounded to 4 decimal places.
        clientPrice:
          type: number
          description: quantity × unitPrice, rounded to 2 decimal places.
        profit:
          type: number
          description: clientPrice − builderCost, rounded to 2 decimal places.
        margin:
          type: number
          description: profit / clientPrice (0 if clientPrice is 0). A raw ratio, e.g. 0.2 for 20% — NOT already multiplied by 100.
      required: [builderCost, unitPrice, clientPrice, profit, margin]

    EstimateItem:
      description: An estimate line item as returned by the API — DB-backed fields plus computed financials.
      allOf:
        - $ref: '#/components/schemas/EstimateItemBase'
        - $ref: '#/components/schemas/EstimateItemFinancials'

    EstimateItemInput:
      type: object
      description: |
        Request body for createEstimateItem and updateEstimateItem. Same
        fields as EstimateItemBase minus the server-assigned, read-only
        fields (id, createdBy, createdAt, updatedAt).
      properties:
        jobId:
          type: string
        groupId:
          type: string
          description: Optional. Omit (or send "unassigned") to trigger the auto-creation/fallback behavior described on createEstimateItem.
        name:
          type: string
        costCode:
          type: string
          default: ''
          enum:
            - ''
            - '00 Preconstruction Services'
            - '01 General Conditions'
            - '02 Site Work'
            - '03 Concrete'
            - '06 Wood & Plastics'
            - '07 Thermal & Moisture Protection'
            - '08 Doors & Windows'
            - '09 Finishes'
            - '10 Specialties'
            - '11 Equipment'
            - '12 Furnishings'
            - '22 Plumbing'
            - '23 HVAC'
            - '26 Electrical'
            - '32 Exterior Improvements'
          description: |
            Optional — the server defaults it to `""`. Leave it blank rather
            than guessing; see EstimateItemBase.costCode.
        description:
          type: string
          default: ''
        internalNotes:
          type: string
          default: ''
        quantity:
          type: number
          format: float
          default: 1
        unit:
          type: string
          default: ''
        unitCost:
          type: number
          format: float
          default: 0
        costType:
          type: string
          enum: [None, Labor, Material, Sub, Equipment, Other]
          default: None
        markupPercent:
          type: number
          format: float
          default: 0
        taxable:
          type: boolean
          default: false
        sortOrder:
          type: integer
          default: 0
      required: [jobId, name]

    EstimateTotals:
      type: object
      description: |
        Aggregate totals — appears both per-group and job-wide (in
        getEstimate's top-level `totals`). Note there is NO `unitPrice`
        key here (that only exists per-item, on EstimateItem) —
        `tax` is always literally the number 0 (no tax-rate modeling
        exists in this API at all), and `totalPrice` always exactly
        equals `clientPrice` (kept as a separate key only because the
        real UI shows both labels, not because there's an independent
        calculation).
      properties:
        builderCost:
          type: number
        clientPrice:
          type: number
        profit:
          type: number
        margin:
          type: number
          description: Raw ratio, e.g. 0.2 for 20%.
        tax:
          type: number
          description: Always exactly 0.
        totalPrice:
          type: number
          description: Always exactly equal to clientPrice.
      required: [builderCost, clientPrice, profit, margin, tax, totalPrice]

    GetEstimateResponse:
      type: object
      description: The full response shape of getEstimate.
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/EstimateGroupWithItems'
        totals:
          $ref: '#/components/schemas/EstimateTotals'
      required: [groups, totals]

    Weather:
      type: object
      description: |
        A weather reading for one job site on one day. Derived
        deterministically from (jobId, date) by server/weather.js — the same
        pair always yields the same reading, which is what lets a log's card,
        detail view and print output agree.
      properties:
        summary:
          type: string
          description: Human-readable conditions, e.g. "Partly cloudy with isolated showers".
        icon:
          type: string
          description: Glyph key for the summary.
          enum: [sun, partly-cloudy, cloud, rain, storm]
        high:
          type: integer
          description: Daily high in °F.
        low:
          type: integer
          description: Daily low in °F.
        wind:
          type: integer
          description: Wind speed in mph.
        humidity:
          type: integer
          description: Relative humidity, as a percentage (0-100).
        precipitation:
          type: number
          description: Total precipitation in inches. 0 on dry days.
        capturedAt:
          type: string
          format: date-time
          description: Nominal observation time — always 06:00 UTC on the log's date.
      required: [summary, icon, high, low, wind, humidity, precipitation, capturedAt]

    DailyLogPhoto:
      type: object
      description: |
        A photo on a daily log. There are no real image files in this repo, so
        a photo carries a `tone` that the UI renders as a tinted placeholder
        tile rather than a URL.
      properties:
        id:
          type: string
        caption:
          type: string
        tone:
          type: string
          enum: [stone, slate, sand, clay, moss]
      required: [id, caption, tone]

    DailyLogComment:
      type: object
      properties:
        id:
          type: string
          description: e.g. "dlc100".
        logId:
          type: string
        author:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, logId, author, body, createdAt]

    DailyLogInput:
      type: object
      description: |
        The writable fields of a daily log, used by both createDailyLog and
        updateDailyLog. Note that update is a full replace, not a patch.
      properties:
        jobId:
          type: string
          description: |
            Required on create, ignored on update (a log cannot change jobs).
          example: j1
        date:
          type: string
          format: date
          description: The day being logged. Required on both create and update.
        title:
          type: string
          maxLength: 50
          description: Optional. Silently truncated at 50 characters. When empty the UI titles the log by its date.
        notes:
          type: string
          maxLength: 4000
          description: |
            Free text, silently truncated at 4000 characters. Conventionally
            uses the "Progress:" / "Issues:" / "Materials Delivered:" headings
            from the settings template — the UI splits on those to lay the
            notes out as labelled sections.
        tags:
          type: array
          items:
            type: string
        shareInternal:
          type: boolean
          default: true
        shareSubs:
          type: boolean
          default: false
        shareClient:
          type: boolean
          default: false
        isPrivate:
          type: boolean
          default: false
          description: Private is exclusive — a private log has no other audience.
        notifyUsers:
          type: array
          items:
            type: string
          description: Names to notify. Recorded only; this mock sends nothing.
        includeWeather:
          type: boolean
          default: true
          description: When true, the server snapshots the day's weather onto the log at write time.
        includeWeatherNotes:
          type: boolean
          default: false
        weatherNotes:
          type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/DailyLogPhoto'
        status:
          type: string
          enum: [draft, published]
          default: published
      # jobId is required on create and ignored on update — one schema
      # serves both, so it is listed here (matching ScheduleItemInput's
      # convention) and updateDailyLog's description says it is ignored.
      required: [jobId, date]

    DailyLog:
      allOf:
        - $ref: '#/components/schemas/DailyLogInput'
        - type: object
          description: A stored daily log — the input fields plus server-owned and derived ones.
          properties:
            id:
              type: string
              description: e.g. "dl100".
            weather:
              description: |
                The snapshot taken at write time, or null when includeWeather
                is false. Always present as a key — check for null rather than
                for absence.

                Note for spec readers: `nullable` beside `allOf` is a no-op in
                OpenAPI 3.0.3 (the nullability does not attach to the composed
                subschema), so the null case is documented here in prose rather
                than being machine-readable. Kept as-is because inlining every
                Weather property just to express it would duplicate the schema.
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Weather'
            attachments:
              type: array
              description: |
                Read-only, and always an empty array. The live Daily Log form
                has an Attachments section, but this mock stores no files —
                nothing reads or writes this beyond echoing it back. It is
                deliberately absent from DailyLogInput: handing an agent an
                `attachments` argument would invite it to invent file
                references that no part of the app can honour.
              readOnly: true
              items:
                type: object
            likes:
              type: array
              items:
                type: string
              description: Names who liked the log. Mutated only by toggleDailyLogLike.
            likeCount:
              type: integer
              description: Derived — the length of `likes`.
            likedByMe:
              type: boolean
              description: Derived — whether the hard-coded current user is in `likes`.
            commentCount:
              type: integer
              description: Derived by counting the comments table, so it can never drift from `comments`.
            comments:
              type: array
              description: Present only on getDailyLog and the mutating endpoints — NOT on listDailyLogs.
              items:
                $ref: '#/components/schemas/DailyLogComment'
            createdBy:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          # Every field below is populated on every read (rowToDailyLog plus
          # decorate), so an agent can rely on all of them being present.
          # `weather` is present-but-null when includeWeather is false, and
          # `comments` is the one exception — single-log reads only.
          required:
            [id, jobId, title, date, notes, tags, shareInternal, shareSubs, shareClient,
             isPrivate, notifyUsers, includeWeather, includeWeatherNotes, weatherNotes,
             weather, photos, attachments, status, likes, likeCount, likedByMe,
             commentCount, createdBy, createdAt, updatedAt]

    DailyLogSettings:
      type: object
      description: |
        Company-wide defaults applied to new daily logs at compose time.
        Editing them never rewrites existing logs.
      properties:
        stampLocation:
          type: boolean
          description: Whether new logs stamp the job-site location.
        defaultNotes:
          type: string
          description: Template pre-filled into a new log's Notes box.
        defaultIncludeWeather:
          type: boolean
        defaultIncludeWeatherNotes:
          type: boolean
        share:
          type: object
          description: Default audiences for a new log. `internal` is always true and cannot be cleared.
          properties:
            internal:
              type: boolean
            subs:
              type: boolean
            client:
              type: boolean
        notify:
          type: object
          description: Which audiences are notified by default. Recorded only; this mock sends nothing.
          properties:
            internal:
              type: boolean
            subs:
              type: boolean
            client:
              type: boolean
      # The whole record is returned on every read — there are no optional
      # fields and no per-job overrides.
      required:
        [stampLocation, defaultNotes, defaultIncludeWeather,
         defaultIncludeWeatherNotes, share, notify]
